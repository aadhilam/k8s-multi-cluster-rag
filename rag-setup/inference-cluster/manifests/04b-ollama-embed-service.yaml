# Service for embedding-only Ollama (nomic-embed-text); used by LiteLLM for /v1/embeddings
apiVersion: v1
kind: Service
metadata:
  name: ollama-embed
  namespace: inference
  labels:
    app: ollama-embed
    app.kubernetes.io/part-of: ai-platform
spec:
  selector:
    app: ollama-embed
  ports:
    - name: http
      port: 11434
      targetPort: 11434
  type: ClusterIP
