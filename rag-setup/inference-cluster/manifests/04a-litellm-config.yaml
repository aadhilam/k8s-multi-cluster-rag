# LiteLLM proxy in inference-cluster: completions to ollama (phi3), embeddings to ollama-embed (nomic-embed-text)
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: inference
  labels:
    app: litellm
    app.kubernetes.io/part-of: ai-platform
data:
  config.yaml: |
    model_list:
      - model_name: phi3
        litellm_params:
          model: ollama/phi3
          api_base: http://ollama.inference.svc.cluster.local:11434
      - model_name: nomic-embed-text
        litellm_params:
          model: ollama/nomic-embed-text
          api_base: http://ollama-embed.inference.svc.cluster.local:11434
    litellm_settings:
      set_verbose: false
