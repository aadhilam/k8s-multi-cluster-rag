apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-agent-config
  namespace: inference
  labels:
    app: rag-agent
    app.kubernetes.io/part-of: ai-platform
data:
  app.py: |
    from flask import Flask, request, jsonify
    import requests
    import os

    app = Flask(__name__)

    # Embedding and completion via LiteLLM proxy (same cluster); Qdrant in embedding-cluster via federated service
    QDRANT_HOST = os.getenv("QDRANT_HOST", "qdrant-federated.embedding.svc.cluster.local")
    QDRANT_PORT = os.getenv("QDRANT_PORT", "6333")
    LITELLM_HOST = os.getenv("LITELLM_HOST", "litellm.inference.svc.cluster.local")
    LITELLM_PORT = os.getenv("LITELLM_PORT", "4000")
    COLLECTION_NAME = os.getenv("COLLECTION_NAME", "documents")
    EMBEDDING_MODEL = os.getenv("EMBEDDING_MODEL", "nomic-embed-text")
    COMPLETION_MODEL = os.getenv("COMPLETION_MODEL", "phi3")

    @app.route("/health", methods=["GET"])
    def health():
        return jsonify({"status": "healthy"})

    @app.route("/query", methods=["POST"])
    def query():
        data = request.json or {}
        question = data.get("question", "").strip()
        if not question:
            return jsonify({"error": "No question provided"}), 400

        debug_info = {}

        # 1. Embed question via LiteLLM proxy (OpenAI-style /v1/embeddings -> Ollama)
        try:
            embed_url = "http://{}:{}/v1/embeddings".format(LITELLM_HOST, LITELLM_PORT)
            embed_response = requests.post(
                embed_url,
                json={"model": EMBEDDING_MODEL, "input": question},
                timeout=60
            )
            embed_response.raise_for_status()
            embed_data = embed_response.json()
            # OpenAI-style: data[0].embedding
            data_list = embed_data.get("data", [])
            query_vector = data_list[0].get("embedding", []) if data_list else []
            if not query_vector:
                debug_info["embedding_error"] = "Empty embedding"
                return jsonify({
                    "question": question,
                    "answer": "Failed to generate embedding",
                    "sources": [],
                    "source_count": 0,
                    "debug": debug_info
                })
            debug_info["embedding_dims"] = len(query_vector)
        except Exception as e:
            debug_info["embedding_error"] = str(e)
            return jsonify({
                "question": question,
                "answer": "Embedding error: " + str(e),
                "sources": [],
                "source_count": 0,
                "debug": debug_info
            })

        # 2. Query vector DB (embedding-cluster via federated)
        try:
            qdrant_url = "http://{}:{}/collections/{}/points/search".format(
                QDRANT_HOST, QDRANT_PORT, COLLECTION_NAME
            )
            search_response = requests.post(
                qdrant_url,
                json={"vector": query_vector, "limit": 3, "with_payload": True},
                timeout=10
            )
            search_data = search_response.json()
            results = search_data.get("result", [])
            debug_info["search_results"] = len(results)
            context_docs = [r.get("payload", {}).get("text", "") for r in results]
        except Exception as e:
            debug_info["search_error"] = str(e)
            context_docs = []

        context = "\n\n".join(context_docs) if context_docs else "No relevant documents found."
        prompt = "Based on the following context, answer the question.\n\nContext:\n" + context + "\n\nQuestion: " + question + "\n\nAnswer:"

        # 3. Generate answer via LiteLLM (same cluster); LiteLLM routes to local Ollama
        try:
            llm_url = "http://{}:{}/v1/chat/completions".format(LITELLM_HOST, LITELLM_PORT)
            llm_response = requests.post(
                llm_url,
                json={
                    "model": COMPLETION_MODEL,
                    "messages": [{"role": "user", "content": prompt}],
                    "stream": False,
                },
                timeout=120,
            )
            data = llm_response.json()
            answer = (data.get("choices") or [{}])[0].get("message", {}).get("content", "Unable to generate response")
        except Exception as e:
            answer = "LLM error: " + str(e)
            debug_info["llm_error"] = str(e)

        return jsonify({
            "question": question,
            "answer": answer,
            "sources": context_docs,
            "source_count": len(context_docs),
            "debug": debug_info
        })

    @app.route("/", methods=["GET"])
    def index():
        return jsonify({
            "service": "RAG Agent (Inference Cluster)",
            "endpoints": {"/query": "POST - Ask a question", "/health": "GET - Health check"}
        })

    if __name__ == "__main__":
        app.run(host="0.0.0.0", port=8080)
