apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: inference
  labels:
    app: litellm
    app.kubernetes.io/part-of: ai-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
        app.kubernetes.io/part-of: ai-platform
    spec:
      nodeSelector:
        workload: "llm"
      tolerations:
        - key: workload
          operator: Equal
          value: "llm"
          effect: NoSchedule
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-latest
          args:
            - "--config"
            - "/etc/litellm/config.yaml"
          ports:
            - containerPort: 4000
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
          env:
            - name: LITELLM_PORT
              value: "4000"
          resources:
            requests:
              memory: "8Gi"
              cpu: "1000m"
            limits:
              memory: "8Gi"
              cpu: "4000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: config
          configMap:
            name: litellm-config
