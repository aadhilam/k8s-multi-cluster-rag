apiVersion: v1
kind: ConfigMap
metadata:
  name: sample-documents
  namespace: embedding
  labels:
    app.kubernetes.io/part-of: ai-platform
data:
  doc1.txt: |
    Company Security Policy v2.3
    All employees must use multi-factor authentication (MFA) when accessing
    company systems. Passwords must be at least 16 characters and changed
    every 90 days. VPN is required for remote access to internal resources.
  doc2.txt: |
    Kubernetes Deployment Guidelines
    All production workloads must define resource requests and limits.
    Use namespaces to isolate workloads by team or environment.
    Network policies should be applied to restrict pod-to-pod communication.
  doc3.txt: |
    Incident Response Procedure
    Step 1: Identify and contain the incident
    Step 2: Notify the security team via #security-incidents Slack channel
    Step 3: Document all actions taken in the incident ticket
    Step 4: Conduct post-incident review within 5 business days
  doc4.txt: |
    AI Model Deployment Checklist
    Before deploying any AI model to production:
    1. Complete bias and fairness assessment
    2. Document model inputs, outputs, and limitations
    3. Ensure inference endpoints have no internet egress
    4. Configure monitoring for drift detection
    5. Obtain sign-off from ML Platform team
