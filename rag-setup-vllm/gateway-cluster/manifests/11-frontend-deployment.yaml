apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: gateway-vllm
  labels:
    app: frontend
    app.kubernetes.io/part-of: ai-platform-vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/part-of: ai-platform-vllm
    spec:
      containers:
        - name: frontend
          image: nginx:alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: html
          configMap:
            name: frontend-config
            items:
              - key: index.html
                path: index.html
        - name: nginx-config
          configMap:
            name: frontend-nginx-config
